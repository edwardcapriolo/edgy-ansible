services:
  opencode-bindmount-workspace:
    hostname: opencode-bindmount-workspace
    container_name: opencode-bindmount-workspace
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - ${PLATFORM:-linux/arm64}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ecapriolo/trusted-opencode:0.0.3-cloudops}
        duid: ${duid}
        dgid: ${dgid}
        dusername: ${dusername}
    entrypoint: "/usr/local/bin/opencode"
    command: [ "web", "--port", "4096", "--hostname", "0.0.0.0", "--log-level", "DEBUG" ]
    devices:
      # Needed by fuse-overlayfs for rootless Docker image storage.
      - /dev/fuse:/dev/fuse
      # Needed by RootlessKit/slirp4netns for nested container networking.
      - /dev/net/tun:/dev/net/tun
    security_opt:
      # Allows namespace, mount, and networking syscalls used by rootless Docker.
      - seccomp=unconfined
      # Avoids AppArmor blocking nested runtime setup on Linux hosts.
      - apparmor=unconfined
      # Allows dockerd-rootless to update required /proc/sys networking state.
      - systempaths=unconfined
    sysctls:
      # Required by dockerd-rootless/rootlesskit networking. For stricter egress,
      # attach this service to a controlled Docker network or force registry/proxy use.
      net.ipv4.ip_forward: "1"
    tmpfs:
      # Writable runtime state for sockets and nested daemon files.
      - /run
      # Writable temporary space for RootlessKit and Docker startup.
      - /tmp
    volumes:
      - ./opencode-config:/home/${dusername}/.config
      - ./m2:/home/${dusername}/.m2
      - ./ai-code:/ai-code
      - ./ai-code:/bi-code
      - ./.deliverance:/home/${dusername}/.deliverance
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TESTCONTAINERS_RYUK_DISABLED: "true"
    user: "${duid}:${dgid}"
    ports:
      - "4097:4096"
